<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Questão do Dia - TutorIA</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .daily-container {
            width: 940px;
            max-width: 100%;
        }

        .daily-card {
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(148, 163, 184, 0.22);
            border-radius: 24px;
            box-shadow: 0 18px 45px rgba(76, 95, 150, 0.14);
            padding: 32px 42px;
            transition: background 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease;
        }

        .daily-title {
            margin: -32px -42px 32px;
            padding: 24px 42px;
            border-radius: 24px 24px 0 0;
            background: linear-gradient(135deg, #3b82f6 0%, #7c3aed 100%);
            color: #ffffff;
            font-size: clamp(2rem, 3vw, 3rem);
            text-align: center;
        }

        .question-content {
            font-size: 22px;
            line-height: 1.6;
            margin-bottom: 30px;
            white-space: pre-wrap;
        }

        .question-image,
        .resolution-image {
            max-width: 100%;
            display: block;
            margin: 20px 0 30px;
            border-radius: 12px;
        }

        #options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            width: 100%;
            padding: 18px;
            margin: 0;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            text-align: left;
            background: #ffffff;
            color: #172b4d;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
        }

        .option:hover {
            transform: translateY(-2px);
            border-color: #7c3aed;
            background: #f5f3ff;
        }

        .option.selected {
            border-width: 2px;
            border-color: #7c3aed;
            background: linear-gradient(135deg, #dbeafe 0%, #ede9fe 100%);
            color: #172b4d;
        }

        .main-button {
            margin-top: 25px;
            padding: 14px 28px;
            background: linear-gradient(135deg, #3b82f6 0%, #7c3aed 100%);
            font-size: 16px;
        }

        .result,
        .resolution {
            margin-top: 25px;
            padding: 25px;
            border: 1px solid rgba(148, 163, 184, 0.22);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.72);
            color: #172b4d;
        }

        .result {
            text-align: center;
        }

        .result h2,
        .resolution h2 {
            margin-top: 0;
        }

        .resolution {
            text-align: left;
        }

        .error {
            color: #b00020;
            font-weight: bold;
        }

        body.dark-mode .daily-container,
        body.dark-mode .question-content {
            color: #f8fafc;
        }

        body.dark-mode .daily-card {
            background: rgba(15, 23, 42, 0.9);
            border-color: rgba(148, 163, 184, 0.22);
            box-shadow: 0 20px 50px rgba(2, 6, 23, 0.48);
        }

        body.dark-mode .daily-title {
            background: linear-gradient(135deg, #1d4ed8 0%, #5b21b6 100%);
            color: #ffffff;
        }

        body.dark-mode .option {
            border-color: #52627a;
            background: #1e293b;
            color: #f8fafc;
        }

        body.dark-mode .option:hover {
            border-color: #a78bfa;
            background: #312e81;
        }

        body.dark-mode .option.selected {
            border-color: #c4b5fd;
            background: linear-gradient(135deg, #1d4ed8 0%, #5b21b6 100%);
            color: #ffffff;
        }

        body.dark-mode .result,
        body.dark-mode .resolution {
            border-color: rgba(148, 163, 184, 0.3);
            background: rgba(15, 23, 42, 0.78);
            color: #f8fafc;
        }

        .back-button {
            margin-top: 25px;
        }

        .daily-container + .theme-toggle-card {
            position: fixed;
            right: 24px;
            bottom: 24px;
            z-index: 20;
            margin-top: 0;
        }

        @media (max-width: 720px) {
            .daily-card {
                padding: 26px 22px;
            }

            .daily-title {
                margin: -26px -22px 28px;
                padding: 24px 22px;
            }

            .daily-container + .theme-toggle-card {
                right: 14px;
                bottom: 14px;
            }
        }
    </style>

</head>


<body class="daily-page">

<div class="daily-particles" aria-hidden="true">
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
</div>

<div class="daily-container">

    <div class="daily-card">

        <h1 class="daily-title">
            Desafio do Dia
        </h1>


        <!-- CARREGANDO -->

        <div id="loading">
            Carregando questão...
        </div>


        <!-- QUESTÃO -->

        <div id="question-area" style="display:none;">

            <div
                id="question-content"
                class="question-content">
            </div>


            <img
                id="question-image"
                class="question-image"
                style="display:none;"
            >


            <div id="options">

                <button
                    class="option"
                    data-option="A">
                </button>

                <button
                    class="option"
                    data-option="B">
                </button>

                <button
                    class="option"
                    data-option="C">
                </button>

                <button
                    class="option"
                    data-option="D">
                </button>

                <button
                    class="option"
                    data-option="E">
                </button>

            </div>


            <button
                id="answer-button"
                class="main-button">

                RESPONDER

            </button>

        </div>


        <!-- RESULTADO -->

        <div
            id="result"
            class="result">

            <h2 id="result-title">
            </h2>

            <p id="result-text">
            </p>


            <button
                id="resolution-button"
                class="main-button">

                VER RESPOSTA E RESOLUÇÃO

            </button>

        </div>


        <!-- RESOLUÇÃO -->

        <div
            id="resolution"
            class="resolution">

            <h2>
                Resposta correta
            </h2>


            <p id="correct-option">
            </p>


            <p id="correct-answer">
            </p>


            <h2>
                Resolução
            </h2>


            <p id="resolution-content">
            </p>


            <img
                id="resolution-image"
                class="resolution-image"
                style="display:none;"
            >

        </div>


        <!-- VOLTAR -->

        <button
            class="main-button back-button"
            onclick="window.location.href='index.html'">

            VOLTAR

        </button>

    </div>

</div>

<div class="theme-toggle-card" aria-label="Alternar tema">
    <button class="theme-toggle" type="button" aria-label="Ativar modo escuro">
        <span class="toggle-track">
            <span class="toggle-thumb"></span>
        </span>
    </button>
</div>



<script>
    const themeToggle = document.querySelector('.theme-toggle');
    const themeBody = document.body;

    function applyTheme(isDark) {
        themeBody.classList.toggle('dark-mode', isDark);
        themeToggle.setAttribute(
            'aria-label',
            isDark ? 'Ativar modo claro' : 'Ativar modo escuro'
        );
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }

    applyTheme(localStorage.getItem('theme') === 'dark');

    themeToggle.addEventListener('click', () => {
        applyTheme(!themeBody.classList.contains('dark-mode'));
    });
</script>

<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>



<script>

let currentQuestion = null;

let selectedOption = null;

let currentUser = null;



const loading =
    document.getElementById("loading");

const questionArea =
    document.getElementById("question-area");

const result =
    document.getElementById("result");

const resolution =
    document.getElementById("resolution");



/* ==========================================
   INICIAR
========================================== */

async function startPage() {

    console.log("Iniciando Questão do Dia...");


    /* -------------------------
       USUÁRIO
    ------------------------- */

    const {
        data: {
            session
        },
        error: userError
    } =
        await supabaseClient.auth.getSession();


    if (userError) {

        console.error(
            "Erro ao pegar usuário:",
            userError
        );

        loading.innerHTML =
            `<p class="error">
                Erro ao verificar usuário.
            </p>`;

        return;

    }


    if (!session || !session.user) {

        window.location.href =
            "login.html";

        return;

    }


    currentUser = session.user;


    console.log(
        "Usuário:",
        currentUser.id
    );



    /* -------------------------
       BUSCAR QUESTÃO
    ------------------------- */

    const {
        data: questions,
        error: questionError
    } =
        await supabaseClient
        .from("daily_questions")
        .select(`
            id,

            question_content,
            question_image_url,

            option_a,
            option_a_image_url,

            option_b,
            option_b_image_url,

            option_c,
            option_c_image_url,

            option_d,
            option_d_image_url,

            option_e,
            option_e_image_url,

            correct_option,
            correct_answer,

            resolution_content,
            resolution_image_url
        `)
        .eq("active", true)
        .limit(1);


    if (questionError) {

        console.error(
            "Erro ao buscar questão:",
            questionError
        );

        loading.innerHTML =
            `<p class="error">
                Erro ao carregar questão.<br><br>
                ${questionError.message}
            </p>`;

        return;

    }


    if (!questions || questions.length === 0) {

        loading.innerHTML =
            "Nenhuma Questão do Dia disponível.";

        return;

    }


    currentQuestion =
        questions[0];


    console.log(
        "Questão encontrada:",
        currentQuestion.id
    );



    /* -------------------------
       VERIFICAR RESPOSTA ANTERIOR
    ------------------------- */

    const {
        data: previousAnswer,
        error: previousAnswerError
    } =
        await supabaseClient
        .from("daily_question_answers")
        .select(`
            selected_option,
            is_correct
        `)
        .eq(
            "user_id",
            currentUser.id
        )
        .eq(
            "question_id",
            currentQuestion.id
        )
        .maybeSingle();


    if (previousAnswerError) {

        console.error(
            "Erro ao verificar resposta:",
            previousAnswerError
        );

        loading.innerHTML =
            `<p class="error">
                Erro ao verificar sua resposta.<br><br>
                ${previousAnswerError.message}
            </p>`;

        return;

    }



    /* ==========================================
       JÁ RESPONDEU
    ========================================== */

    if (previousAnswer) {

        console.log(
            "Usuário já respondeu."
        );


        loading.style.display =
            "none";

        questionArea.style.display =
            "none";


        showResult(
            previousAnswer.selected_option,
            previousAnswer.is_correct
        );


        return;

    }



    /* ==========================================
       NÃO RESPONDEU
    ========================================== */

    console.log(
        "Usuário ainda não respondeu."
    );


    renderQuestion();

}



/* ==========================================
   RENDERIZAR QUESTÃO
========================================== */

function renderQuestion() {

    loading.style.display =
        "none";

    questionArea.style.display =
        "block";


    document
        .getElementById("question-content")
        .textContent =
        currentQuestion.question_content;



    /* IMAGEM */

    if (
        currentQuestion.question_image_url
    ) {

        const image =
            document.getElementById(
                "question-image"
            );

        image.src =
            currentQuestion.question_image_url;

        image.style.display =
            "block";

    }



    /* ALTERNATIVAS */

    const options = {

        A: currentQuestion.option_a,

        B: currentQuestion.option_b,

        C: currentQuestion.option_c,

        D: currentQuestion.option_d,

        E: currentQuestion.option_e

    };


    document
        .querySelectorAll(".option")
        .forEach(button => {

            const letter =
                button.dataset.option;


            button.textContent =
                `${letter}) ${options[letter]}`;

        });

}



/* ==========================================
   SELECIONAR ALTERNATIVA
========================================== */

document
    .querySelectorAll(".option")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {


                document
                    .querySelectorAll(".option")
                    .forEach(btn => {

                        btn.classList.remove(
                            "selected"
                        );

                    });


                button.classList.add(
                    "selected"
                );


                selectedOption =
                    button.dataset.option;


                console.log(
                    "Alternativa selecionada:",
                    selectedOption
                );

            }
        );

    });



/* ==========================================
   RESPONDER
========================================== */

document
    .getElementById("answer-button")
    .addEventListener(
        "click",
        saveAnswer
    );



async function saveAnswer() {

    /* -------------------------
       VERIFICAR ALTERNATIVA
    ------------------------- */

    if (!selectedOption) {

        alert(
            "Escolha uma alternativa primeiro."
        );

        return;

    }


    console.log(
        "Tentando salvar resposta..."
    );



    /* -------------------------
       CALCULAR ACERTO
    ------------------------- */

    const isCorrect =
        selectedOption ===
        currentQuestion.correct_option;


    console.log(
        "Correta:",
        currentQuestion.correct_option
    );

    console.log(
        "Selecionada:",
        selectedOption
    );

    console.log(
        "Acertou:",
        isCorrect
    );



    /* -------------------------
       SALVAR NO SUPABASE
    ------------------------- */

    const { error } =
        await supabaseClient
        .from("daily_question_answers")
        .insert({

            user_id:
                currentUser.id,

            question_id:
                currentQuestion.id,

            selected_option:
                selectedOption,

            is_correct:
                isCorrect

        });



    /* -------------------------
       ERRO
    ------------------------- */

    if (error) {

        console.error(
            "ERRO AO SALVAR:",
            error
        );


        alert(
            "Erro ao salvar sua resposta:\n\n" +
            error.message
        );


        return;

    }



    console.log(
        "Resposta salva com sucesso."
    );



    /* -------------------------
       ESCONDER QUESTÃO
    ------------------------- */

    questionArea.style.display =
        "none";



    /* -------------------------
       MOSTRAR RESULTADO
    ------------------------- */

    showResult(
        selectedOption,
        isCorrect
    );

}



/* ==========================================
   MOSTRAR RESULTADO
========================================== */

function showResult(
    userOption,
    isCorrect
) {

    result.style.display =
        "block";


    const title =
        document.getElementById(
            "result-title"
        );

    const text =
        document.getElementById(
            "result-text"
        );



    if (isCorrect) {

        title.textContent =
            "Você acertou! 🎉";

        text.textContent =
            `Você marcou a alternativa ${userOption}.`;

    }

    else {

        title.textContent =
            "Você errou.";

        text.textContent =
            `Você marcou a alternativa ${userOption}.`;

    }

}



/* ==========================================
   MOSTRAR RESPOSTA E RESOLUÇÃO
========================================== */

document
    .getElementById("resolution-button")
    .addEventListener(
        "click",
        showResolution
    );



function showResolution() {

    resolution.style.display =
        "block";



    /* -------------------------
       ALTERNATIVA CORRETA
    ------------------------- */

    document
        .getElementById("correct-option")
        .textContent =
        `Alternativa correta: ${currentQuestion.correct_option}`;



    /* -------------------------
       RESPOSTA
    ------------------------- */

    document
        .getElementById("correct-answer")
        .textContent =
        `Resposta: ${currentQuestion.correct_answer}`;



    /* -------------------------
       RESOLUÇÃO
    ------------------------- */

    document
        .getElementById("resolution-content")
        .textContent =
        currentQuestion.resolution_content ||
        "A resolução ainda não foi cadastrada.";



    /* -------------------------
       IMAGEM DA RESOLUÇÃO
    ------------------------- */

    if (
        currentQuestion.resolution_image_url
    ) {

        const image =
            document.getElementById(
                "resolution-image"
            );

        image.src =
            currentQuestion.resolution_image_url;

        image.style.display =
            "block";

    }

}



/* ==========================================
   INICIAR
========================================== */

startPage();

</script>

</body>
</html>
