<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Questão do Dia | TutorIA</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .daily-question-container {
            width: min(850px, 92%);
            margin: 60px auto;
        }

        .daily-question-header {
            margin-bottom: 40px;
        }

        .daily-label {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .daily-question-header h1 {
            margin-top: 8px;
        }

        #questionText {
            font-size: 22px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        #questionImage {
            display: none;
            max-width: 100%;
            margin: 20px 0 30px;
            border-radius: 12px;
        }

        .answer-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .answer-option {
            width: 100%;
            padding: 18px;
            text-align: left;

            border: 1px solid #ccc;
            border-radius: 12px;

            background: transparent;
            cursor: pointer;

            font-size: 16px;

            transition:
                transform 0.2s ease,
                border-color 0.2s ease,
                background 0.2s ease;
        }

        .answer-option:hover {
            transform: translateY(-2px);
        }

        .answer-option.selected {
            border-width: 2px;
        }

        .option-image {
            display: none;
            max-width: 100%;
            margin-top: 12px;
            border-radius: 8px;
        }

        #answerButton,
        #showAnswerButton,
        #backButton {
            margin-top: 25px;
            padding: 14px 28px;

            border: none;
            border-radius: 10px;

            cursor: pointer;

            font-size: 16px;
            font-weight: 600;
        }

        #resultArea {
            text-align: center;
        }

        #resultIcon {
            font-size: 55px;
            margin-bottom: 10px;
        }

        #resultTitle {
            font-size: 32px;
            margin-bottom: 15px;
        }

        #resultMessage {
            font-size: 18px;
        }

        .answer-summary {
            margin: 30px auto;
            padding: 20px;

            border-radius: 12px;

            text-align: left;

            max-width: 500px;
        }

        .answer-summary p {
            margin: 10px 0;
        }

        #correctAnswerArea {
            max-width: 600px;
            margin: 25px auto;
            padding: 25px;

            border-radius: 12px;

            text-align: left;
        }

        #correctAnswerArea h3 {
            margin-bottom: 12px;
        }

        #correctAnswerText {
            font-size: 18px;
            line-height: 1.5;
        }

        #resolutionArea {
            max-width: 700px;
            margin: 25px auto;
            padding: 25px;

            border-radius: 12px;

            text-align: left;
        }

        #resolutionText {
            font-size: 17px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        #backButton {
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>

    <main class="daily-question-container">

        <!-- QUESTÃO -->
        <section id="questionArea">

            <div class="daily-question-header">
                <span class="daily-label">DESAFIO DO DIA</span>

                <h1>Questão do Dia</h1>
            </div>

            <div id="questionText">
                Carregando questão...
            </div>

            <img
                id="questionImage"
                alt="Imagem da questão"
            >

            <div class="answer-options">

                <button class="answer-option" data-option="A">
                    <strong>A)</strong>
                    <span id="optionAText"></span>
                    <img id="optionAImage" class="option-image" alt="">
                </button>

                <button class="answer-option" data-option="B">
                    <strong>B)</strong>
                    <span id="optionBText"></span>
                    <img id="optionBImage" class="option-image" alt="">
                </button>

                <button class="answer-option" data-option="C">
                    <strong>C)</strong>
                    <span id="optionCText"></span>
                    <img id="optionCImage" class="option-image" alt="">
                </button>

                <button class="answer-option" data-option="D">
                    <strong>D)</strong>
                    <span id="optionDText"></span>
                    <img id="optionDImage" class="option-image" alt="">
                </button>

                <button class="answer-option" data-option="E">
                    <strong>E)</strong>
                    <span id="optionEText"></span>
                    <img id="optionEImage" class="option-image" alt="">
                </button>

            </div>

            <button id="answerButton">
                RESPONDER
            </button>

        </section>


        <!-- RESULTADO -->
        <section id="resultArea" class="hidden">

            <div id="resultIcon"></div>

            <h2 id="resultTitle"></h2>

            <p id="resultMessage"></p>

            <div class="answer-summary">

                <p>
                    <strong>Sua resposta:</strong>
                    <span id="userAnswer"></span>
                </p>

                <p>
                    <strong>Resposta correta:</strong>
                    <span id="correctOption"></span>
                </p>

            </div>

            <button id="showAnswerButton">
                VER RESPOSTA
            </button>


            <!-- RESPOSTA -->
            <div id="correctAnswerArea" class="hidden">

                <h3>Resposta correta</h3>

                <p id="correctAnswerText"></p>

            </div>


            <!-- RESOLUÇÃO -->
            <div id="resolutionArea" class="hidden">

                <h3>Resolução</h3>

                <p id="resolutionText"></p>

            </div>


            <button id="backButton">
                VOLTAR
            </button>

        </section>

    </main>


    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase-config.js"></script>


    <script>

        let currentQuestion = null;
        let selectedOption = null;


        async function loadDailyQuestion() {

            // Verifica se está logado
            const { data: { user } } =
                await supabaseClient.auth.getUser();

            if (!user) {
                window.location.href = "login.html";
                return;
            }


            // Busca a questão ativa
            const { data, error } = await supabaseClient
                .from("daily_questions")
                .select(`
                    id,
                    question_content,
                    question_image_url,

                    option_a,
                    option_a_image_url,

                    option_b,
                    option_b_image_url,

                    option_c,
                    option_c_image_url,

                    option_d,
                    option_d_image_url,

                    option_e,
                    option_e_image_url,

                    correct_option,
                    correct_answer,

                    resolution_content,
                    resolution_image_url
                `)
                .eq("active", true)
                .limit(1);


            if (error) {

                console.error(error);

                document.getElementById("questionText").textContent =
                    "Não foi possível carregar a questão.";

                return;
            }


            if (!data || data.length === 0) {

                document.getElementById("questionText").textContent =
                    "Nenhuma questão do dia está disponível.";

                return;
            }


            currentQuestion = data[0];


            // ENUNCIADO
            document.getElementById("questionText").textContent =
                currentQuestion.question_content;


            // IMAGEM DO ENUNCIADO
            if (currentQuestion.question_image_url) {

                const image =
                    document.getElementById("questionImage");

                image.src =
                    currentQuestion.question_image_url;

                image.style.display = "block";
            }


            // ALTERNATIVAS
            loadOption(
                "A",
                currentQuestion.option_a,
                currentQuestion.option_a_image_url
            );

            loadOption(
                "B",
                currentQuestion.option_b,
                currentQuestion.option_b_image_url
            );

            loadOption(
                "C",
                currentQuestion.option_c,
                currentQuestion.option_c_image_url
            );

            loadOption(
                "D",
                currentQuestion.option_d,
                currentQuestion.option_d_image_url
            );

            loadOption(
                "E",
                currentQuestion.option_e,
                currentQuestion.option_e_image_url
            );
        }


        function loadOption(letter, text, imageUrl) {

            document.getElementById(
                "option" + letter + "Text"
            ).textContent = text;


            if (imageUrl) {

                const image =
                    document.getElementById(
                        "option" + letter + "Image"
                    );

                image.src = imageUrl;

                image.style.display = "block";
            }
        }


        // Selecionar alternativa
        document.querySelectorAll(".answer-option")
            .forEach(button => {

                button.addEventListener("click", () => {

                    document.querySelectorAll(".answer-option")
                        .forEach(btn =>
                            btn.classList.remove("selected")
                        );

                    button.classList.add("selected");

                    selectedOption =
                        button.dataset.option;
                });

            });


        // RESPONDER
        document.getElementById("answerButton")
            .addEventListener("click", () => {

                if (!selectedOption) {

                    alert("Selecione uma alternativa.");

                    return;
                }


                const correct =
                    selectedOption === currentQuestion.correct_option;


                document.getElementById("questionArea")
                    .classList.add("hidden");

                document.getElementById("resultArea")
                    .classList.remove("hidden");


                document.getElementById("userAnswer")
                    .textContent = selectedOption;

                document.getElementById("correctOption")
                    .textContent =
                    currentQuestion.correct_option;


                if (correct) {

                    document.getElementById("resultIcon")
                        .textContent = "✓";

                    document.getElementById("resultTitle")
                        .textContent = "Você acertou!";

                    document.getElementById("resultMessage")
                        .textContent =
                        "Boa! Você resolveu o desafio do dia.";

                } else {

                    document.getElementById("resultIcon")
                        .textContent = "✗";

                    document.getElementById("resultTitle")
                        .textContent = "Você errou.";

                    document.getElementById("resultMessage")
                        .textContent =
                        "Não tem problema. Veja a resposta e a resolução.";
                }

            });


        // VER RESPOSTA
        document.getElementById("showAnswerButton")
            .addEventListener("click", () => {

                const correct =
                    currentQuestion.correct_option;

                const optionText =
                    currentQuestion[
                        "option_" + correct.toLowerCase()
                    ];


                document.getElementById("correctAnswerText")
                    .textContent =
                    correct + ") " + optionText;


                document.getElementById("correctAnswerArea")
                    .classList.remove("hidden");


                if (currentQuestion.resolution_content) {

                    document.getElementById("resolutionText")
                        .textContent =
                        currentQuestion.resolution_content;

                    document.getElementById("resolutionArea")
                        .classList.remove("hidden");
                }


                if (currentQuestion.resolution_image_url) {

                    // Por enquanto deixamos a imagem
                    // para a próxima etapa.
                }


                document.getElementById("showAnswerButton")
                    .classList.add("hidden");

            });


        // VOLTAR
        document.getElementById("backButton")
            .addEventListener("click", () => {

                window.location.href = "index.html";

            });


        // INICIAR
        loadDailyQuestion();

    </script>

</body>
</html>
