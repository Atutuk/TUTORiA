<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Questão do Dia - TutorIA</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .daily-container {
            max-width: 800px;
            margin: 50px auto;
            padding: 30px;
        }

        .question-card {
            padding: 30px;
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .question-content {
            font-size: 20px;
            margin-bottom: 25px;
            white-space: pre-wrap;
        }

        .option {
            display: block;
            width: 100%;
            padding: 16px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            text-align: left;
            font-size: 17px;
        }

        .option:hover {
            border-color: #555;
        }

        .option.selected {
            border-color: #000;
            background: #f2f2f2;
        }

        .action-button {
            margin-top: 20px;
            padding: 15px 25px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        .result {
            display: none;
            margin-top: 25px;
        }

        .resolution {
            display: none;
            margin-top: 25px;
            padding: 20px;
            border-radius: 12px;
            background: #f5f5f5;
        }

        .back-button {
            margin-top: 25px;
        }

        img {
            max-width: 100%;
            border-radius: 10px;
            margin: 15px 0;
        }
    </style>
</head>

<body>

<div class="daily-container">

    <div class="question-card">

        <h1>Desafio do Dia</h1>

        <div id="loading">
            Carregando questão...
        </div>

        <div id="question-area" style="display:none;">

            <div id="question-content" class="question-content"></div>

            <img id="question-image" style="display:none;">

            <div id="options">

                <button class="option" data-option="A"></button>
                <button class="option" data-option="B"></button>
                <button class="option" data-option="C"></button>
                <button class="option" data-option="D"></button>
                <button class="option" data-option="E"></button>

            </div>

            <button
                id="answer-button"
                class="action-button">
                RESPONDER
            </button>

        </div>

        <!-- RESULTADO -->

        <div id="result" class="result">

            <h2 id="result-title"></h2>

            <p id="result-text"></p>

            <button
                id="resolution-button"
                class="action-button">
                VER RESPOSTA E RESOLUÇÃO
            </button>

        </div>

        <!-- RESOLUÇÃO -->

        <div id="resolution" class="resolution">

            <h2>Resposta correta</h2>

            <p id="correct-option"></p>

            <p id="correct-answer"></p>

            <h2>Resolução</h2>

            <p id="resolution-content"></p>

            <img
                id="resolution-image"
                style="display:none;">

        </div>

        <button
            class="action-button back-button"
            onclick="window.location.href='index.html'">
            VOLTAR
        </button>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>

let currentQuestion = null;
let selectedOption = null;

const loading = document.getElementById("loading");
const questionArea = document.getElementById("question-area");
const result = document.getElementById("result");
const resolution = document.getElementById("resolution");


// ================================
// INICIAR
// ================================

async function startPage() {

    // Verifica usuário
    const {
        data: { user },
        error: userError
    } = await supabaseClient.auth.getUser();

    if (userError || !user) {

        window.location.href = "login.html";
        return;

    }


    // Busca questão ativa
    const {
        data: questions,
        error: questionError
    } = await supabaseClient
        .from("daily_questions")
        .select(`
            id,
            question_content,
            question_image_url,

            option_a,
            option_a_image_url,

            option_b,
            option_b_image_url,

            option_c,
            option_c_image_url,

            option_d,
            option_d_image_url,

            option_e,
            option_e_image_url,

            correct_option,
            correct_answer,

            resolution_content,
            resolution_image_url
        `)
        .eq("active", true)
        .limit(1);


    if (questionError) {

        console.error(questionError);

        loading.innerText =
            "Erro ao carregar a questão.";

        return;

    }


    if (!questions || questions.length === 0) {

        loading.innerText =
            "Nenhuma Questão do Dia disponível.";

        return;

    }


    currentQuestion = questions[0];


    // Verifica se o usuário já respondeu
    const {
        data: previousAnswer,
        error: answerError
    } = await supabaseClient
        .from("daily_question_answers")
        .select(`
            selected_option,
            is_correct
        `)
        .eq("user_id", user.id)
        .eq("question_id", currentQuestion.id)
        .maybeSingle();


    if (answerError) {

        console.error(answerError);

        loading.innerText =
            "Erro ao verificar sua resposta.";

        return;

    }


    // =================================
    // JÁ RESPONDEU
    // =================================

    if (previousAnswer) {

        loading.style.display = "none";

        questionArea.style.display = "none";

        showResult(
            previousAnswer.selected_option,
            previousAnswer.is_correct
        );

        return;

    }


    // =================================
    // AINDA NÃO RESPONDEU
    // =================================

    renderQuestion();

}


// ================================
// MOSTRAR QUESTÃO
// ================================

function renderQuestion() {

    loading.style.display = "none";

    questionArea.style.display = "block";


    document.getElementById("question-content")
        .textContent = currentQuestion.question_content;


    // Imagem da questão
    if (currentQuestion.question_image_url) {

        const img =
            document.getElementById("question-image");

        img.src =
            currentQuestion.question_image_url;

        img.style.display = "block";

    }


    // Alternativas

    const options = {

        A: currentQuestion.option_a,
        B: currentQuestion.option_b,
        C: currentQuestion.option_c,
        D: currentQuestion.option_d,
        E: currentQuestion.option_e

    };


    document.querySelectorAll(".option")
        .forEach(button => {

            const letter =
                button.dataset.option;

            button.textContent =
                `${letter}) ${options[letter]}`;

        });

}


// ================================
// SELECIONAR ALTERNATIVA
// ================================

document.querySelectorAll(".option")
    .forEach(button => {

        button.addEventListener("click", () => {

            document.querySelectorAll(".option")
                .forEach(btn =>
                    btn.classList.remove("selected")
                );

            button.classList.add("selected");

            selectedOption =
                button.dataset.option;

        });

    });


// ================================
// RESPONDER
// ================================

document.getElementById("answer-button")
    .addEventListener("click", async () => {

        if (!selectedOption) {

            alert("Escolha uma alternativa primeiro.");

            return;

        }


        const {
            data: { user }
        } = await supabaseClient.auth.getUser();


        const isCorrect =
            selectedOption ===
            currentQuestion.correct_option;


        // Salva resposta
        const {
            error
        } = await supabaseClient
            .from("daily_question_answers")
            .insert({

                user_id: user.id,

                question_id:
                    currentQuestion.id,

                selected_option:
                    selectedOption,

                is_correct:
                    isCorrect

            });


        if (error) {

            console.error(error);

            alert(
                "Não foi possível salvar sua resposta."
            );

            return;

        }


        // Esconde questão
        questionArea.style.display =
            "none";


        // Mostra resultado
        showResult(
            selectedOption,
            isCorrect
        );

    });


// ================================
// MOSTRAR RESULTADO
// ================================

function showResult(
    userOption,
    isCorrect
) {

    result.style.display = "block";


    const title =
        document.getElementById("result-title");

    const text =
        document.getElementById("result-text");


    if (isCorrect) {

        title.textContent =
            "Você acertou! 🎉";

        text.textContent =
            `Você marcou a alternativa ${userOption}.`;

    } else {

        title.textContent =
            "Você errou.";

        text.textContent =
            `Você marcou a alternativa ${userOption}.`;

    }

}


// ================================
// VER RESPOSTA + RESOLUÇÃO
// ================================

document.getElementById("resolution-button")
    .addEventListener("click", () => {

        resolution.style.display = "block";


        const options = {

            A: currentQuestion.option_a,
            B: currentQuestion.option_b,
            C: currentQuestion.option_c,
            D: currentQuestion.option_d,
            E: currentQuestion.option_e

        };


        // Alternativa correta

        document.getElementById("correct-option")
            .textContent =
            `Alternativa ${currentQuestion.correct_option}`;


        // Resposta

        document.getElementById("correct-answer")
            .textContent =
            `Resposta: ${currentQuestion.correct_answer}`;


        // Resolução

        document.getElementById("resolution-content")
            .textContent =
            currentQuestion.resolution_content ||
            "A resolução desta questão ainda não foi cadastrada.";


        // Imagem da resolução

        if (currentQuestion.resolution_image_url) {

            const img =
                document.getElementById("resolution-image");

            img.src =
                currentQuestion.resolution_image_url;

            img.style.display =
                "block";

        }

    });


// Inicia página
startPage();

</script>

</body>
</html>
