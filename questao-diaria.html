<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Questão do Dia - TutorIA</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .daily-container {
            max-width: 850px;
            margin: 40px auto;
            padding: 20px;
        }

        .daily-card {
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
        }

        .daily-title {
            margin-bottom: 30px;
        }

        .question-content {
            font-size: 20px;
            line-height: 1.6;
            margin-bottom: 20px;
            white-space: pre-wrap;
        }

        .question-image,
        .resolution-image {
            max-width: 100%;
            display: block;
            margin: 20px auto;
            border-radius: 10px;
        }

        .option {
            width: 100%;
            display: block;

            padding: 16px;
            margin: 12px 0;

            border: 2px solid #ddd;
            border-radius: 12px;

            background: white;

            font-size: 17px;
            text-align: left;

            cursor: pointer;

            transition: 0.2s;
        }

        .option:hover {
            border-color: #777;
        }

        .option.selected {
            border-color: #111;
            background: #f1f1f1;
        }

        .main-button {
            margin-top: 20px;

            padding: 15px 25px;

            border: none;
            border-radius: 10px;

            background: #111;
            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        .main-button:hover {
            opacity: 0.85;
        }

        .result {
            display: none;

            margin-top: 25px;
            padding: 25px;

            border-radius: 14px;

            background: #f5f5f5;
        }

        .result h2 {
            margin-top: 0;
        }

        .resolution {
            display: none;

            margin-top: 25px;
            padding: 25px;

            border-radius: 14px;

            background: #f5f5f5;
        }

        .error {
            color: #b00020;
            font-weight: bold;
        }

        .back-button {
            margin-top: 25px;
        }
    </style>

</head>


<body>

<div class="daily-container">

    <div class="daily-card">

        <h1 class="daily-title">
            Desafio do Dia
        </h1>


        <!-- CARREGANDO -->

        <div id="loading">
            Carregando questão...
        </div>


        <!-- QUESTÃO -->

        <div id="question-area" style="display:none;">

            <div
                id="question-content"
                class="question-content">
            </div>


            <img
                id="question-image"
                class="question-image"
                style="display:none;"
            >


            <div id="options">

                <button
                    class="option"
                    data-option="A">
                </button>

                <button
                    class="option"
                    data-option="B">
                </button>

                <button
                    class="option"
                    data-option="C">
                </button>

                <button
                    class="option"
                    data-option="D">
                </button>

                <button
                    class="option"
                    data-option="E">
                </button>

            </div>


            <button
                id="answer-button"
                class="main-button">

                RESPONDER

            </button>

        </div>


        <!-- RESULTADO -->

        <div
            id="result"
            class="result">

            <h2 id="result-title">
            </h2>

            <p id="result-text">
            </p>


            <button
                id="resolution-button"
                class="main-button">

                VER RESPOSTA E RESOLUÇÃO

            </button>

        </div>


        <!-- RESOLUÇÃO -->

        <div
            id="resolution"
            class="resolution">

            <h2>
                Resposta correta
            </h2>


            <p id="correct-option">
            </p>


            <p id="correct-answer">
            </p>


            <h2>
                Resolução
            </h2>


            <p id="resolution-content">
            </p>


            <img
                id="resolution-image"
                class="resolution-image"
                style="display:none;"
            >

        </div>


        <!-- VOLTAR -->

        <button
            class="main-button back-button"
            onclick="window.location.href='index.html'">

            VOLTAR

        </button>

    </div>

</div>



<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>



<script>

let currentQuestion = null;

let selectedOption = null;

let currentUser = null;



const loading =
    document.getElementById("loading");

const questionArea =
    document.getElementById("question-area");

const result =
    document.getElementById("result");

const resolution =
    document.getElementById("resolution");



/* ==========================================
   INICIAR
========================================== */

async function startPage() {

    console.log("Iniciando Questão do Dia...");


    /* -------------------------
       USUÁRIO
    ------------------------- */

    const {
        data: {
            session
        },
        error: userError
    } =
        await supabaseClient.auth.getSession();


    if (userError) {

        console.error(
            "Erro ao pegar usuário:",
            userError
        );

        loading.innerHTML =
            `<p class="error">
                Erro ao verificar usuário.
            </p>`;

        return;

    }


    if (!session || !session.user) {

        window.location.href =
            "login.html";

        return;

    }


    currentUser = session.user;


    console.log(
        "Usuário:",
        currentUser.id
    );



    /* -------------------------
       BUSCAR QUESTÃO
    ------------------------- */

    const {
        data: questions,
        error: questionError
    } =
        await supabaseClient
        .from("daily_questions")
        .select(`
            id,

            question_content,
            question_image_url,

            option_a,
            option_a_image_url,

            option_b,
            option_b_image_url,

            option_c,
            option_c_image_url,

            option_d,
            option_d_image_url,

            option_e,
            option_e_image_url,

            correct_option,
            correct_answer,

            resolution_content,
            resolution_image_url
        `)
        .eq("active", true)
        .limit(1);


    if (questionError) {

        console.error(
            "Erro ao buscar questão:",
            questionError
        );

        loading.innerHTML =
            `<p class="error">
                Erro ao carregar questão.<br><br>
                ${questionError.message}
            </p>`;

        return;

    }


    if (!questions || questions.length === 0) {

        loading.innerHTML =
            "Nenhuma Questão do Dia disponível.";

        return;

    }


    currentQuestion =
        questions[0];


    console.log(
        "Questão encontrada:",
        currentQuestion.id
    );



    /* -------------------------
       VERIFICAR RESPOSTA ANTERIOR
    ------------------------- */

    const {
        data: previousAnswer,
        error: previousAnswerError
    } =
        await supabaseClient
        .from("daily_question_answers")
        .select(`
            selected_option,
            is_correct
        `)
        .eq(
            "user_id",
            currentUser.id
        )
        .eq(
            "question_id",
            currentQuestion.id
        )
        .maybeSingle();


    if (previousAnswerError) {

        console.error(
            "Erro ao verificar resposta:",
            previousAnswerError
        );

        loading.innerHTML =
            `<p class="error">
                Erro ao verificar sua resposta.<br><br>
                ${previousAnswerError.message}
            </p>`;

        return;

    }



    /* ==========================================
       JÁ RESPONDEU
    ========================================== */

    if (previousAnswer) {

        console.log(
            "Usuário já respondeu."
        );


        loading.style.display =
            "none";

        questionArea.style.display =
            "none";


        showResult(
            previousAnswer.selected_option,
            previousAnswer.is_correct
        );


        return;

    }



    /* ==========================================
       NÃO RESPONDEU
    ========================================== */

    console.log(
        "Usuário ainda não respondeu."
    );


    renderQuestion();

}



/* ==========================================
   RENDERIZAR QUESTÃO
========================================== */

function renderQuestion() {

    loading.style.display =
        "none";

    questionArea.style.display =
        "block";


    document
        .getElementById("question-content")
        .textContent =
        currentQuestion.question_content;



    /* IMAGEM */

    if (
        currentQuestion.question_image_url
    ) {

        const image =
            document.getElementById(
                "question-image"
            );

        image.src =
            currentQuestion.question_image_url;

        image.style.display =
            "block";

    }



    /* ALTERNATIVAS */

    const options = {

        A: currentQuestion.option_a,

        B: currentQuestion.option_b,

        C: currentQuestion.option_c,

        D: currentQuestion.option_d,

        E: currentQuestion.option_e

    };


    document
        .querySelectorAll(".option")
        .forEach(button => {

            const letter =
                button.dataset.option;


            button.textContent =
                `${letter}) ${options[letter]}`;

        });

}



/* ==========================================
   SELECIONAR ALTERNATIVA
========================================== */

document
    .querySelectorAll(".option")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {


                document
                    .querySelectorAll(".option")
                    .forEach(btn => {

                        btn.classList.remove(
                            "selected"
                        );

                    });


                button.classList.add(
                    "selected"
                );


                selectedOption =
                    button.dataset.option;


                console.log(
                    "Alternativa selecionada:",
                    selectedOption
                );

            }
        );

    });



/* ==========================================
   RESPONDER
========================================== */

document
    .getElementById("answer-button")
    .addEventListener(
        "click",
        saveAnswer
    );



async function saveAnswer() {

    /* -------------------------
       VERIFICAR ALTERNATIVA
    ------------------------- */

    if (!selectedOption) {

        alert(
            "Escolha uma alternativa primeiro."
        );

        return;

    }


    console.log(
        "Tentando salvar resposta..."
    );



    /* -------------------------
       CALCULAR ACERTO
    ------------------------- */

    const isCorrect =
        selectedOption ===
        currentQuestion.correct_option;


    console.log(
        "Correta:",
        currentQuestion.correct_option
    );

    console.log(
        "Selecionada:",
        selectedOption
    );

    console.log(
        "Acertou:",
        isCorrect
    );



    /* -------------------------
       SALVAR NO SUPABASE
    ------------------------- */

    const { error } =
        await supabaseClient
        .from("daily_question_answers")
        .insert({

            user_id:
                currentUser.id,

            question_id:
                currentQuestion.id,

            selected_option:
                selectedOption,

            is_correct:
                isCorrect

        });



    /* -------------------------
       ERRO
    ------------------------- */

    if (error) {

        console.error(
            "ERRO AO SALVAR:",
            error
        );


        alert(
            "Erro ao salvar sua resposta:\n\n" +
            error.message
        );


        return;

    }



    console.log(
        "Resposta salva com sucesso."
    );



    /* -------------------------
       ESCONDER QUESTÃO
    ------------------------- */

    questionArea.style.display =
        "none";



    /* -------------------------
       MOSTRAR RESULTADO
    ------------------------- */

    showResult(
        selectedOption,
        isCorrect
    );

}



/* ==========================================
   MOSTRAR RESULTADO
========================================== */

function showResult(
    userOption,
    isCorrect
) {

    result.style.display =
        "block";


    const title =
        document.getElementById(
            "result-title"
        );

    const text =
        document.getElementById(
            "result-text"
        );



    if (isCorrect) {

        title.textContent =
            "Você acertou! 🎉";

        text.textContent =
            `Você marcou a alternativa ${userOption}.`;

    }

    else {

        title.textContent =
            "Você errou.";

        text.textContent =
            `Você marcou a alternativa ${userOption}.`;

    }

}



/* ==========================================
   MOSTRAR RESPOSTA E RESOLUÇÃO
========================================== */

document
    .getElementById("resolution-button")
    .addEventListener(
        "click",
        showResolution
    );



function showResolution() {

    resolution.style.display =
        "block";



    /* -------------------------
       ALTERNATIVA CORRETA
    ------------------------- */

    document
        .getElementById("correct-option")
        .textContent =
        `Alternativa correta: ${currentQuestion.correct_option}`;



    /* -------------------------
       RESPOSTA
    ------------------------- */

    document
        .getElementById("correct-answer")
        .textContent =
        `Resposta: ${currentQuestion.correct_answer}`;



    /* -------------------------
       RESOLUÇÃO
    ------------------------- */

    document
        .getElementById("resolution-content")
        .textContent =
        currentQuestion.resolution_content ||
        "A resolução ainda não foi cadastrada.";



    /* -------------------------
       IMAGEM DA RESOLUÇÃO
    ------------------------- */

    if (
        currentQuestion.resolution_image_url
    ) {

        const image =
            document.getElementById(
                "resolution-image"
            );

        image.src =
            currentQuestion.resolution_image_url;

        image.style.display =
            "block";

    }

}



/* ==========================================
   INICIAR
========================================== */

startPage();

</script>

</body>
</html>
