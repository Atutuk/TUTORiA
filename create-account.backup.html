<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta - TutorIA</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
</head>

<body>

    <main class="login-wrapper">
        <div class="title-box">
            <h1>Criar conta</h1>
        </div>

        <form id="createAccountForm" class="content-box login-box account-box">
            <input id="name" type="text" placeholder="Seu nome" required>
            <input id="email" type="email" placeholder="Seu e-mail" required>

            <div class="password-field-wrap">
                <input id="password" type="password" placeholder="Crie uma senha" required>
                <div id="passwordRules" class="password-rules" aria-live="polite">
                    <p>Sua senha deve conter:</p>
                    <ul>
                        <li data-rule="length">• no mínimo 8 caracteres</li>
                        <li data-rule="letter">• pelo menos 1 letra</li>
                        <li data-rule="number">• pelo menos 1 número</li>
                        <li data-rule="special">• pelo menos 1 caractere especial</li>
                    </ul>
                </div>
            </div>

            <input id="confirmPassword" type="password" placeholder="Confirme sua senha" required>
            <p id="errorMessage" class="form-error" aria-live="polite"></p>
            <button type="submit">Criar conta</button>

            <p>Já tem uma conta?</p>

            <a href="login.html">
                <button class="secondary-btn" type="button">Entrar</button>
            </a>
        </form>
    </main>

    <div class="theme-toggle-card" aria-label="Alternar tema">
        <button class="theme-toggle" type="button" aria-label="Ativar modo escuro">
            <span class="toggle-track">
                <span class="toggle-thumb"></span>
            </span>
        </button>
    </div>

    <script>
        const toggle = document.querySelector('.theme-toggle');
        const body = document.body;

        function applyTheme(isDark) {
            body.classList.toggle('dark-mode', isDark);
            toggle.setAttribute('aria-label', isDark ? 'Ativar modo claro' : 'Ativar modo escuro');
            toggle.querySelector('.toggle-thumb').style.transform = isDark ? 'translateX(52px) rotate(180deg)' : 'translateX(0) rotate(0deg)';
            toggle.querySelector('.toggle-thumb').style.background = isDark ? '#dbeafe' : '#fff9d9';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            applyTheme(true);
        }

        toggle.addEventListener('click', () => {
            const isDark = !body.classList.contains('dark-mode');
            applyTheme(isDark);
        });

        const form = document.getElementById('createAccountForm');
        const errorMessage = document.getElementById('errorMessage');
        const fields = {
            name: document.getElementById('name'),
            email: document.getElementById('email'),
            password: document.getElementById('password'),
            confirmPassword: document.getElementById('confirmPassword')
        };
        const passwordRules = document.getElementById('passwordRules');
        const ruleItems = {
            length: document.querySelector('[data-rule="length"]'),
            letter: document.querySelector('[data-rule="letter"]'),
            number: document.querySelector('[data-rule="number"]'),
            special: document.querySelector('[data-rule="special"]')
        };

        function updatePasswordRules() {
            const value = fields.password.value;
            const checks = {
                length: value.length >= 8,
                letter: /[A-Za-z]/.test(value),
                number: /\d/.test(value),
                special: /[^A-Za-z0-9]/.test(value)
            };

            Object.entries(ruleItems).forEach(([key, item]) => {
                const isValid = checks[key];
                item.classList.toggle('valid', isValid);
                item.classList.toggle('invalid', !isValid && value.length > 0);
            });
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }

        function markInvalid(field) {
            field.style.borderColor = '#dc2626';
            field.style.boxShadow = '0 0 0 3px rgba(220, 38, 38, 0.12)';
        }

        function clearInvalids() {
            Object.values(fields).forEach(field => {
                field.style.borderColor = '#dfe7f3';
                field.style.boxShadow = 'none';
            });
        }

        function keepPasswordRulesOpen() {
            passwordRules.classList.add('show');
        }

        function hidePasswordRules() {
            setTimeout(() => {
                if (document.activeElement !== fields.password && document.activeElement !== fields.confirmPassword) {
                    passwordRules.classList.remove('show');
                }
            }, 120);
        }

        fields.password.addEventListener('focus', keepPasswordRulesOpen);
        fields.confirmPassword.addEventListener('focus', keepPasswordRulesOpen);
        fields.password.addEventListener('input', updatePasswordRules);

        fields.password.addEventListener('blur', hidePasswordRules);
        fields.confirmPassword.addEventListener('blur', hidePasswordRules);

        form.addEventListener('submit', async function (event) {
    event.preventDefault();

    clearInvalids();
    errorMessage.textContent = '';
    errorMessage.style.display = 'none';

    const name = fields.name.value.trim();
    const email = fields.email.value.trim();
    const password = fields.password.value;
    const confirmPassword = fields.confirmPassword.value;

    if (!name) {
        markInvalid(fields.name);
        showError('O nome é obrigatório.');
        return;
    }

    if (!email) {
        markInvalid(fields.email);
        showError('O e-mail é obrigatório.');
        return;
    }

    if (!password) {
        markInvalid(fields.password);
        showError('A senha é obrigatória.');
        return;
    }

    if (password.length < 8) {
        markInvalid(fields.password);
        showError('A senha deve ter no mínimo 8 caracteres.');
        return;
    }

    if (!/[A-Za-z]/.test(password)) {
        markInvalid(fields.password);
        showError('A senha deve conter pelo menos 1 letra.');
        return;
    }

    if (!/\d/.test(password)) {
        markInvalid(fields.password);
        showError('A senha deve conter pelo menos 1 número.');
        return;
    }

    if (!/[^A-Za-z0-9]/.test(password)) {
        markInvalid(fields.password);
        showError('A senha deve conter pelo menos 1 caractere especial.');
        return;
    }

    if (!confirmPassword) {
        markInvalid(fields.confirmPassword);
        showError('Confirme sua senha.');
        return;
    }

    if (password !== confirmPassword) {
        markInvalid(fields.confirmPassword);
        showError('As senhas não coincidem.');
        return;
    }

    try {
        const { data, error } = await supabaseClient.auth.signUp({
            email: email,
            password: password,
            options: {
                data: {
                    name: name
                }
            }
        });

        if (error) {
            console.error(error);

            const errorText = error.message.toLowerCase();

            if (errorText.includes('already registered') || errorText.includes('already exists')) {
                markInvalid(fields.email);
                showError('Já existe uma conta com este e-mail.');
            } else if (errorText.includes('error sending confirmation email') || errorText.includes('email rate limit')) {
                showError('A conta pode ter sido criada, mas o Supabase não conseguiu enviar o e-mail de confirmação. Verifique a configuração SMTP e o limite de envio no painel do Supabase.');
            } else if (errorText.includes('password')) {
                markInvalid(fields.password);
                showError(error.message);
            } else if (errorText.includes('invalid email')) {
                markInvalid(fields.email);
                showError('Informe um e-mail válido.');
            } else {
                showError('Não foi possível criar a conta: ' + error.message);
            }

            return;
        }

        alert(
            'Conta criada com sucesso!\n\n' +
            'Enviamos um e-mail de confirmação para ' + email + '.\n\n' +
            'Confirme seu e-mail antes de entrar no TutorIA.'
        );

        window.location.href = 'login.html';

    } catch (error) {
        console.error(error);
        showError('Ocorreu um erro inesperado: ' + error.message);
    }
});
    </script>

</body>

</html>
