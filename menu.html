<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - TutorIA</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
</head>

<body class="menu-body">
    <div class="daily-particles" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span>
    </div>
    <main class="menu-shell">
        <div class="title-box">
            <span class="welcome-badge">Sua jornada começa aqui</span>
            <h1>Bem-vindo ao TutorIA</h1>
            <p class="hero-kicker">Cinco passos simples para estudar melhor.</p>
        </div>

        <section class="content-box tutorial-card" aria-live="polite">
            <div class="welcome-header">
                <span class="welcome-badge">Guia inicial</span>
                <h2 id="tutorialTitle">Passo 1</h2>
            </div>

            <div class="tutorial-step">
                <p id="tutorialText">Comece escolhendo a área da sua jornada de estudos.</p>
                <ul id="tutorialList">
                    <li>Explore a sua trilha de aprendizagem.</li>
                    <li>Entenda como funciona a plataforma.</li>
                </ul>
            </div>

            <div class="tutorial-navigation">
                <button id="backButton" class="secondary-btn" type="button" disabled>Voltar</button>
                <button id="nextButton" type="button">Próximo</button>
            </div>

            <div class="tutorial-actions">
                <button id="logoutButton" class="secondary-btn" type="button">Sair</button>
            </div>

            <div class="tutorial-progress">
                <span id="stepCounter">1 / 5</span>
            </div>
        </section>
    </main>

    <div class="theme-toggle-card" aria-label="Alternar tema">
        <button class="theme-toggle" type="button" aria-label="Ativar modo escuro">
            <span class="toggle-track">
                <span class="toggle-thumb"></span>
            </span>
        </button>
    </div>

    <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>

    <script>
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            if (!container) return;

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.dataset.icon = type === 'success' ? '✓' : type === 'error' ? '!' : 'i';
            toast.textContent = message;
            container.appendChild(toast);

            setTimeout(() => {
                toast.remove();
            }, 2800);
        }

        (async function protectMenu() {
            const { data, error } = await supabaseClient.auth.getSession();

            if (error || !data.session) {
                window.location.replace('login.html');
            }
        })();
    </script>

    <script>
        const toggle = document.querySelector('.theme-toggle');
        const body = document.body;

        function applyTheme(isDark) {
            body.classList.toggle('dark-mode', isDark);
            toggle.setAttribute('aria-label', isDark ? 'Ativar modo claro' : 'Ativar modo escuro');
            const thumb = toggle.querySelector('.toggle-thumb');
            thumb.style.transform = isDark ? 'translateX(52px) rotate(180deg)' : 'translateX(0) rotate(0deg)';
            thumb.style.background = isDark ? '#dbeafe' : '#fff9d9';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            applyTheme(true);
        }

        toggle.addEventListener('click', () => {
            const isDark = !body.classList.contains('dark-mode');
            applyTheme(isDark);
        });

        const tutorialSteps = [
            {
                title: 'Passo 1',
                text: 'Comece escolhendo a área da sua jornada de estudos.',
                items: ['Explore a sua trilha de aprendizagem.', 'Entenda como funciona a plataforma.']
            },
            {
                title: 'Passo 2',
                text: 'Organize os seus objetivos e defina o foco do dia.',
                items: ['Crie metas simples e alcançáveis.', 'Concentre-se em uma tarefa por vez.']
            },
            {
                title: 'Passo 3',
                text: 'Acesse os materiais e conteúdos recomendados para o seu nível.',
                items: ['Revise os módulos principais.', 'Escolha o melhor recurso para aprender.']
            },
            {
                title: 'Passo 4',
                text: 'Pratique com exercícios e acompanhe o seu progresso.',
                items: ['Resolva desafios com frequência.', 'Revise os pontos que ainda precisam de atenção.']
            },
            {
                title: 'Passo 5',
                text: 'Finalize o seu planejamento e siga em frente com confiança.',
                items: ['Seu progresso será salvo automaticamente.', 'Você pode voltar a qualquer momento.']
            }
        ];

        const tutorialTitle = document.getElementById('tutorialTitle');
        const tutorialText = document.getElementById('tutorialText');
        const tutorialList = document.getElementById('tutorialList');
        const stepCounter = document.getElementById('stepCounter');
        const backButton = document.getElementById('backButton');
        const nextButton = document.getElementById('nextButton');
        const logoutButton = document.getElementById('logoutButton');

        let currentStep = 0;

        function renderStep() {
            const step = tutorialSteps[currentStep];
            tutorialTitle.textContent = step.title;
            tutorialText.textContent = step.text;
            tutorialList.innerHTML = step.items.map(item => `<li>${item}</li>`).join('');
            stepCounter.textContent = `${currentStep + 1} / ${tutorialSteps.length}`;

            backButton.disabled = currentStep === 0;

            if (currentStep === tutorialSteps.length - 1) {
                nextButton.textContent = 'Concluir';
            } else {
                nextButton.textContent = 'Próximo';
            }
        }

        backButton.addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep -= 1;
                renderStep();
            }
        });

        nextButton.addEventListener('click', () => {
            if (currentStep < tutorialSteps.length - 1) {
                currentStep += 1;
                renderStep();
            } else {
                window.location.replace('index.html');
            }
        });

        logoutButton.addEventListener('click', async () => {
            const { error } = await supabaseClient.auth.signOut();

            if (error) {
                console.error(error);
                showToast('Não foi possível sair da conta.', 'error');
                return;
            }

            localStorage.removeItem('loggedInUser');
            localStorage.removeItem('rememberedEmail');

            showToast('Você saiu da conta.', 'success');

            setTimeout(() => {
                window.location.replace('login.html');
            }, 700);
        });

        renderStep();
    </script>
</body>

</html>
